<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="silkred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="50%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Pocket outline -->
  <rect x="20" y="50" width="60" height="40" rx="3" fill="#2F4F4F"/>
  <!-- Pocket square peeking out - puff fold style -->
  <path d="M30 50 Q35 30 50 25 Q65 30 70 50" fill="url(#silkred)"/>
  <!-- Fabric folds -->
  <path d="M35 50 Q40 35 50 32" stroke="#a00" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M65 50 Q60 35 50 32" stroke="#a00" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Pattern dots -->
  <circle cx="42" cy="38" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="50" cy="35" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="58" cy="38" r="2" fill="#FFD700" opacity="0.6"/>
</svg>