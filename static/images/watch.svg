<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#708090"/>
      <stop offset="50%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#708090"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Strap top -->
  <rect x="38" y="5" width="24" height="25" rx="2" fill="#2F4F4F"/>
  <!-- Strap bottom -->
  <rect x="38" y="70" width="24" height="25" rx="2" fill="#2F4F4F"/>
  <!-- Watch case -->
  <circle cx="50" cy="50" r="25" fill="url(#steel)"/>
  <!-- Watch face -->
  <circle cx="50" cy="50" r="20" fill="#1a1a2e"/>
  <!-- Hour markers -->
  <circle cx="50" cy="33" r="2" fill="#FFD700"/>
  <circle cx="67" cy="50" r="2" fill="#FFD700"/>
  <circle cx="50" cy="67" r="2" fill="#FFD700"/>
  <circle cx="33" cy="50" r="2" fill="#FFD700"/>
  <!-- Hands -->
  <line x1="50" y1="50" x2="50" y2="38" stroke="#FFD700" stroke-width="2"/>
  <line x1="50" y1="50" x2="60" y2="55" stroke="#C0C0C0" stroke-width="1.5"/>
  <!-- Center -->
  <circle cx="50" cy="50" r="3" fill="#FFD700"/>
</svg>