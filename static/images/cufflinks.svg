<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="silvercuff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#E8E8E8"/>
      <stop offset="100%" style="stop-color:#A9A9A9"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Left cufflink -->
  <circle cx="30" cy="50" r="18" fill="url(#silvercuff)"/>
  <circle cx="30" cy="50" r="12" fill="#1a1a2e"/>
  <circle cx="30" cy="50" r="6" fill="#4169E1"/>
  <ellipse cx="28" cy="48" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  <!-- Right cufflink -->
  <circle cx="70" cy="50" r="18" fill="url(#silvercuff)"/>
  <circle cx="70" cy="50" r="12" fill="#1a1a2e"/>
  <circle cx="70" cy="50" r="6" fill="#4169E1"/>
  <ellipse cx="68" cy="48" rx="2" ry="1.5" fill="#87CEEB" opacity="0.6"/>
  <!-- Connector bars -->
  <rect x="26" y="70" width="8" height="15" rx="2" fill="url(#silvercuff)"/>
  <rect x="66" y="70" width="8" height="15" rx="2" fill="url(#silvercuff)"/>
</svg>