<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="walletleather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#333333"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Wallet body -->
  <rect x="15" y="25" width="70" height="50" rx="5" fill="url(#walletleather)"/>
  <!-- Fold line -->
  <line x1="50" y1="25" x2="50" y2="75" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Card slots -->
  <rect x="55" y="32" width="25" height="8" rx="2" fill="#2a2a2a"/>
  <rect x="55" y="44" width="25" height="8" rx="2" fill="#2a2a2a"/>
  <rect x="55" y="56" width="25" height="8" rx="2" fill="#2a2a2a"/>
  <!-- Stitching -->
  <rect x="17" y="27" width="66" height="46" rx="4" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Logo/brand accent -->
  <rect x="22" y="45" width="20" height="12" rx="2" fill="#FFD700" opacity="0.8"/>
</svg>