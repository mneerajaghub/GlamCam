<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="darkleather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2914"/>
      <stop offset="50%" style="stop-color:#5C4033"/>
      <stop offset="100%" style="stop-color:#3D2914"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Belt strap -->
  <rect x="5" y="40" width="90" height="20" rx="2" fill="url(#darkleather)"/>
  <!-- Buckle frame -->
  <rect x="15" y="35" width="25" height="30" rx="3" fill="#C0C0C0" stroke="#808080" stroke-width="2"/>
  <!-- Buckle inner -->
  <rect x="20" y="40" width="15" height="20" rx="2" fill="#FFF5EE"/>
  <!-- Prong -->
  <line x1="27" y1="38" x2="27" y2="62" stroke="#808080" stroke-width="3"/>
  <!-- Belt holes -->
  <circle cx="55" cy="50" r="3" fill="#2F1810"/>
  <circle cx="68" cy="50" r="3" fill="#2F1810"/>
  <circle cx="81" cy="50" r="3" fill="#2F1810"/>
  <!-- Stitching -->
  <line x1="42" y1="43" x2="95" y2="43" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="42" y1="57" x2="95" y2="57" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,2"/>
</svg>