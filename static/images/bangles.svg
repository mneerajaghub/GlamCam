<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Multiple bangles stacked -->
  <ellipse cx="50" cy="40" rx="30" ry="12" stroke="#FFD700" stroke-width="4" fill="none"/>
  <ellipse cx="50" cy="50" rx="30" ry="12" stroke="#E31837" stroke-width="4" fill="none"/>
  <ellipse cx="50" cy="60" rx="30" ry="12" stroke="#228B22" stroke-width="4" fill="none"/>
  <ellipse cx="50" cy="70" rx="30" ry="12" stroke="url(#gold2)" stroke-width="4" fill="none"/>
  <!-- Decorative dots -->
  <circle cx="25" cy="50" r="2" fill="#FFD700"/>
  <circle cx="75" cy="50" r="2" fill="#FFD700"/>
  <circle cx="25" cy="60" r="2" fill="#FFD700"/>
  <circle cx="75" cy="60" r="2" fill="#FFD700"/>
</svg>