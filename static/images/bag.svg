<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="50%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#6B3E26"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#FFF5EE"/>
  <!-- Bag body -->
  <rect x="20" y="35" width="60" height="50" rx="5" fill="url(#leather)"/>
  <!-- Handles -->
  <path d="M35 35 Q35 15 50 15 Q65 15 65 35" stroke="url(#leather)" stroke-width="5" fill="none"/>
  <!-- Flap -->
  <path d="M20 45 L50 55 L80 45 L80 35 L20 35 Z" fill="#6B3E26"/>
  <!-- Clasp -->
  <ellipse cx="50" cy="52" rx="6" ry="4" fill="#FFD700"/>
  <!-- Stitching -->
  <line x1="25" y1="60" x2="75" y2="60" stroke="#5C4033" stroke-width="1" stroke-dasharray="3,2"/>
</svg>